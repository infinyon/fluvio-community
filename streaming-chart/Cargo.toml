[package]
name = "streaming-chart"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.70"
bytes = "1.1.0"
# fluvio = { version = "0.23.4", default-features = false }
fluvio = { git = "https://github.com/infinyon/fluvio.git", tag = "v0.13.0-dev-3" }
futures-util = "0.3.28"
poem = { version = "3.0.1", features = ["embed", "websocket"] }
rust-embed = "8.4.0"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
tokio = { version = "1.27.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
