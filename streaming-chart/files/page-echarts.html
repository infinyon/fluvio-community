
<!DOCTYPE html>
<html>
<head>
    <title>Apache Echarts: WebSocket Plot</title>
    <!-- try apache echarts -->
    <script src=" https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js "></script>
</head>
<body>
    <div id="chart" style="width: 600px; height: 400px;"></div>
    <script>
        // Initialize ECharts chart
        // https://echarts.apache.org/handbook/en/how-to/chart-types/scatter/basic-scatter
        var chart = echarts.init(document.querySelector("#chart"));

        // Set chart options
        var option = {
          dataZoom: [
            {
              type: 'slider'
            },
            {
              type: 'inside'
            }
          ],
          xAxis: {
            type: 'value'
          },
          yAxis: {
            type: 'value'
          },
          series: [{
            // type: 'line', // a little bit of update justter on ff
            type: 'scatter',
            data: []
          }]
        };
        chart.setOption(option);

        async function startStream() {
          const response = await fetch("/http-stream/foo");
          const reader = response.body.pipeThrough(new TextDecoderStream()).pipeThrough(new NdJsonDeframer()).getReader();

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            option.series[0].data.push([value.x, value.y]);
            chart.setOption(option);
          }
        }

        startStream();

        class NdJsonDeframer extends TransformStream {
          constructor() {
            let remaining = '';
            super({
              transform(chunk, controller) {
                chunk.split('\n').forEach((line) => {
                  if (line) {
                    if (remaining.length > 0) {
                      line = remaining + line;
                      remaining = '';
                    }
                    try {
                      const data = JSON.parse(line);
                      controller.enqueue(data);
                    } catch (e) {
                      remaining += line;
                    }
                  }
                });
              }
            });
          }
        }
    </script>
</body>
</html>
